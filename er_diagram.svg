<polyline points="220,445 220,385 520,385 520,325" fill="none" stroke="#333" stroke-width="2"/>
<rect x="330.0" y="360.0" width="80" height="23" fill="white"/><text x="370.0" y="377.0" text-anchor="middle" font-family="Arial" font-size="15">1 : M</text>
<polyline points="660,325 660,390 910,390 910,430" fill="none" stroke="#333" stroke-width="2"/>
<rect x="745.0" y="365.0" width="80" height="23" fill="white"/><text x="785.0" y="382.0" text-anchor="middle" font-family="Arial" font-size="15">1 : 0..1</text>
<text x="590" y="680" text-anchor="middle" font-family="Arial" font-size="17">Пользователь M:N Мероприятие через Заявку. UNIQUE review.request_id: не более одного отзыва.</text></svg>