<rect x="350.0" y="195.0" width="80" height="23" fill="white"/><text x="390.0" y="212.0" text-anchor="middle" font-family="Arial" font-size="15">1 : M</text>
<polyline points="820,220 760,220" fill="none" stroke="#333" stroke-width="2"/>
